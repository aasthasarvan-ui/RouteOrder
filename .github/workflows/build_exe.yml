name: Build Streamlit EXE

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Check out repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install streamlit pandas openpyxl pytz fpdf pyinstaller
      shell: cmd

    - name: Build EXE with PyInstaller and Streamlit Hooks
      run: |
        python -c "import streamlit; print(streamlit.__path__[0])" > st_path.txt
        set /p ST_DIR=<st_path.txt
        
        REM NOTE: 'your_script_name.py' ki jagah apni main python file ka naam likhein (jaise app.py)
        pyinstaller --noconsole --onedir --name="SalesOrderAutomation" ^
          --add-data "%ST_DIR%/static;streamlit/static" ^
          --hidden-import=streamlit ^
          --hidden-import=pandas ^
          --hidden-import=openpyxl ^
          --hidden-import=pytz ^
          --hidden-import=fpdf ^
          --hidden-import=sqlite3 ^
          app.py
      shell: cmd

    - name: Archive production artifacts
      uses: actions/upload-artifact@v4
      with:
        name: SalesOrderAutomation-EXE
        path: dist/SalesOrderAutomation/
