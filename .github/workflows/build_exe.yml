name: Build Streamlit EXE

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Check out repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install streamlit pandas openpyxl pytz fpdf pyinstaller

    - name: Build EXE with PyInstaller
      run: |
        # PyInstaller command jo Streamlit ko standalone app ki tarah pack karegi
        pyinstaller --noconsole --onedir --name="SalesOrderAutomation" your_script_name.py

    - name: Archive production artifacts
      uses: actions/upload-artifact@v4
      with:
        name: SalesOrderAutomation-EXE
        path: dist/SalesOrderAutomation/
